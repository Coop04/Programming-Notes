<body>
    <form action="">
        <h1>Temperature Convertion:</h1>
        <input type="number" id="textBox"><br><br>

        <input type="radio" name="unit" id="toFahrenheit"> <!--name helps to only select a one radio button at a time-->
        <label for="toFahrenheit">Celsius ➡️ Fahrenheit</label><br>

        <input type="radio" name="unit" id="toCelsius">
        <label for="toCelsius">Fahrenheit ➡️ Celsius</label><br><br>

        <button type="button" onclick="convert()">Submit</button><br><br>
        <p id="result">Select a unit</p>
    </form>
    <script src="index.js"></script>
</body>
