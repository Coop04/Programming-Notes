<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <input type="checkbox" id="myCheckbox">
      <label for="myCheckbox">Subscribe</label><br><br> <!--if for attribute is same as the id of checkbox it will still select the checkbox-->
      
      <input type="radio" id="visaBtn" name="card"> <!--by giving name attribute to all of the radio buttons only one button can be selected at a time-->
      <label for="visaBtn">Visa</label><br>
      <input type="radio" id="masterCardBtn" name="card">
      <label for="masterCardBtn">Master Card</label><br>
      <input type="radio" id="paypalBtn" name="card">
      <label for="paypalBtn">Paypal</label><br><br>

      <button type="submit" id="mySubmit">Submit</button>

      <p id="subResult"></p>
      <p id="paymentResult"></p>
      
    <script src="index.js"></script>
</body>
</html>
